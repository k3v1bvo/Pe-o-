name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Vercel production URL to load inside the Calculadora Android APK'
        required: true
        default: 'https://calc-app-tawny.vercel.app'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and Capacitor
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Android project with Calculadora icon
        env:
          CAP_SERVER_URL: ${{ github.event.inputs.web_url }}
        run: |
          mkdir -p out
          cat <<EOF > out/index.html
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora</title></head>
          <body style="margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
          <script>window.location.replace("${CAP_SERVER_URL}");</script>
          </body></html>
          EOF
          npx cap add android || true
          npx cap sync android
          cp -r android-icons/res/* android/app/src/main/res/

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
