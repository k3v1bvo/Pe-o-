name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Vercel production URL to wrap inside Android APK (or leave empty for static export)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and Capacitor
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Android project
        run: |
          mkdir -p out
          echo '<!doctype html><html><body><script>window.location.href="${{ github.event.inputs.web_url }}";</script></body></html>' > out/index.html
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

